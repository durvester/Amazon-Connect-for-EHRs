[project]
name = "pf-ci-harness"
version = "0.0.1"
description = "Four-layer CI harness for the PF voice verification platform (Session 0005)"
requires-python = ">=3.12"
dependencies = [
    "pynacl>=1.5",
    "requests>=2.32",
    "boto3>=1.34",
    "moto[dynamodb,kms,secretsmanager]>=5",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pf-practice-api",
    "pf-oauth-service",
    "pf-routing",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

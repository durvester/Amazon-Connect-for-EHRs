[project]
name = "tool-fhir-query"
version = "0.0.1"
description = "Lambda tool: query FHIR clinical resources with voice-safe projections"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.34",
    "requests>=2.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "responses>=0.25",
    "ruff>=0.5",
    "moto[s3,dynamodb,kms,secretsmanager]>=5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

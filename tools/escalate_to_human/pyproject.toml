[project]
name = "tool-escalate-to-human"
version = "0.0.1"
description = "Lambda tool: set escalate flag on Connect contact for human handoff"
requires-python = ">=3.12"
dependencies = ["boto3>=1.34", "pydantic>=2.7"]

[project.optional-dependencies]
dev = ["pytest>=8", "moto>=5", "ruff>=0.5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

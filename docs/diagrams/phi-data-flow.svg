<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" font-family="Inter, -apple-system, sans-serif" font-size="12">
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#475569"/>
    </marker>
    <marker id="ar-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#dc2626"/>
    </marker>
    <marker id="ar-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#16a34a"/>
    </marker>
  </defs>

  <rect width="920" height="520" fill="#f8fafc" rx="8"/>
  <text x="460" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">PHI Data Flow — Where Patient Data Lives and Never Lives</text>
  <text x="460" y="46" text-anchor="middle" font-size="11" fill="#64748b">Red zones are encrypted at rest + audited. Gray zones never see PHI values.</text>


  <rect x="30" y="80" width="120" height="55" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="90" y="100" text-anchor="middle" font-weight="600" fill="#1e40af">Caller</text>
  <text x="90" y="116" text-anchor="middle" font-size="10" fill="#3b82f6">Speaks: name,</text>
  <text x="90" y="128" text-anchor="middle" font-size="10" fill="#3b82f6">DOB, reason</text>

  <line x1="150" y1="107" x2="188" y2="107" stroke="#475569" stroke-width="1" marker-end="url(#ar)"/>
  <text x="169" y="99" font-size="9" fill="#64748b">audio</text>

  <rect x="190" y="80" width="130" height="55" rx="8" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="255" y="100" text-anchor="middle" font-weight="600" fill="#5b21b6">Nova 2 Sonic</text>
  <text x="255" y="116" text-anchor="middle" font-size="10" fill="#7c3aed">Speech ↔ text</text>
  <text x="255" y="128" text-anchor="middle" font-size="10" fill="#94a3b8">Transient only</text>

  <line x1="320" y1="107" x2="358" y2="107" stroke="#475569" stroke-width="1" marker-end="url(#ar)"/>
  <text x="339" y="99" font-size="9" fill="#64748b">text</text>

  <rect x="360" y="80" width="150" height="55" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="435" y="100" text-anchor="middle" font-weight="600" fill="#92400e">Code-Hook + Claude</text>
  <text x="435" y="116" text-anchor="middle" font-size="10" fill="#a16207">Reasoning + tool calls</text>
  <text x="435" y="128" text-anchor="middle" font-size="10" fill="#94a3b8">Transient only</text>

  <line x1="510" y1="107" x2="548" y2="107" stroke="#475569" stroke-width="1" marker-end="url(#ar)"/>
  <text x="529" y="99" font-size="9" fill="#64748b">params</text>

  <rect x="550" y="80" width="140" height="55" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="620" y="100" text-anchor="middle" font-weight="600" fill="#92400e">lookup_patient</text>
  <text x="620" y="116" text-anchor="middle" font-size="10" fill="#a16207">FHIR search</text>
  <text x="620" y="128" text-anchor="middle" font-size="10" fill="#94a3b8">Transient only</text>

  <line x1="690" y1="107" x2="738" y2="107" stroke="#dc2626" stroke-width="1.5" marker-end="url(#ar-red)"/>
  <text x="714" y="99" font-size="9" fill="#dc2626">FHIR</text>

  <rect x="740" y="80" width="150" height="55" rx="8" fill="#fce7f3" stroke="#ec4899" stroke-width="1.5"/>
  <text x="815" y="100" text-anchor="middle" font-weight="600" fill="#9d174d">EHR FHIR R4</text>
  <text x="815" y="116" text-anchor="middle" font-size="10" fill="#be185d">Patient resource</text>
  <text x="815" y="128" text-anchor="middle" font-size="10" fill="#dc2626" font-weight="600">PHI SOURCE</text>

  <rect x="540" y="62" width="360" height="82" rx="10" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="720" y="58" text-anchor="middle" font-size="10" font-weight="700" fill="#dc2626">PHI IN MEMORY (never persisted unencrypted)</text>


  <rect x="340" y="170" width="350" height="55" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
  <text x="515" y="190" text-anchor="middle" font-weight="600" fill="#166534">Returned to Code-Hook (safe projection)</text>
  <text x="515" y="206" text-anchor="middle" font-size="10" fill="#047857">name · dob · phone_masked: "+1***5550199"</text>
  <text x="515" y="218" text-anchor="middle" font-size="10" fill="#047857">NO: full phone, SSN, address, insurance, clinical data</text>

  <line x1="620" y1="135" x2="515" y2="168" stroke="#16a34a" stroke-width="1.5" marker-end="url(#ar-green)"/>

  <rect x="30" y="170" width="290" height="44" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="175" y="188" text-anchor="middle" font-weight="600" fill="#1e40af">Spoken to Caller (Nova Sonic)</text>
  <text x="175" y="204" text-anchor="middle" font-size="10" fill="#3b82f6">"I've verified your identity, James." — first name only</text>

  <line x1="340" y1="192" x2="322" y2="192" stroke="#475569" stroke-width="1" marker-end="url(#ar)"/>

  <text x="460" y="260" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">What Gets Persisted</text>

  <rect x="30" y="280" width="260" height="88" rx="8" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
  <text x="160" y="300" text-anchor="middle" font-weight="700" fill="#991b1b">S3 Audit Bucket (Object Lock)</text>
  <text x="160" y="318" text-anchor="middle" font-size="10" fill="#dc2626">practice_id, call_id</text>
  <text x="160" y="332" text-anchor="middle" font-size="10" fill="#dc2626">patient_resource_id: "Patient/12345"</text>
  <text x="160" y="346" text-anchor="middle" font-size="10" fill="#dc2626">disclosed_fields: ["name", "dob"]</text>
  <text x="160" y="360" text-anchor="middle" font-size="10" fill="#dc2626">KMS-encrypted · 7-year retention</text>

  <rect x="330" y="280" width="260" height="88" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="460" y="300" text-anchor="middle" font-weight="700" fill="#92400e">DDB: calls table</text>
  <text x="460" y="318" text-anchor="middle" font-size="10" fill="#a16207">practice_id, call_id</text>
  <text x="460" y="332" text-anchor="middle" font-size="10" fill="#a16207">verification_outcome: "verified"</text>
  <text x="460" y="346" text-anchor="middle" font-size="10" fill="#a16207">caller_phone_masked: "+1***5550199"</text>
  <text x="460" y="360" text-anchor="middle" font-size="10" fill="#a16207">KMS-encrypted (phi-key)</text>

  <rect x="630" y="280" width="260" height="88" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="760" y="300" text-anchor="middle" font-weight="700" fill="#475569">CloudWatch Logs</text>
  <text x="760" y="318" text-anchor="middle" font-size="10" fill="#64748b">practice_id, call_id</text>
  <text x="760" y="332" text-anchor="middle" font-size="10" fill="#64748b">tool: "lookup_patient"</text>
  <text x="760" y="346" text-anchor="middle" font-size="10" fill="#64748b">decision: "single_match"</text>
  <text x="760" y="360" text-anchor="middle" font-size="10" fill="#64748b" font-weight="600">NO PHI VALUES — ever</text>

  <rect x="30" y="400" width="860" height="60" rx="8" fill="#fff" stroke="#ef4444" stroke-width="2"/>
  <text x="460" y="422" text-anchor="middle" font-weight="700" font-size="14" fill="#dc2626">NEVER PERSISTED — ANYWHERE</text>
  <text x="460" y="442" text-anchor="middle" font-size="11" fill="#991b1b">Patient name values · Date of birth · Full phone numbers · SSN · Address · Insurance</text>
  <text x="460" y="456" text-anchor="middle" font-size="11" fill="#991b1b">Clinical data · FHIR resource bodies · Conversation transcripts</text>

  <text x="460" y="500" text-anchor="middle" font-size="10" fill="#94a3b8">PHI flows through Lambda memory only. It is never written to disk, logs, or unencrypted storage.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 780" font-family="Inter, -apple-system, sans-serif" font-size="12">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#475569"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#16a34a"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="880" height="780" fill="#f8fafc" rx="8"/>
  <text x="440" y="30" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">Call State Machine — Every Path a Call Can Take</text>

  <circle cx="440" cy="70" r="22" fill="#3b82f6" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="440" y="74" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">START</text>

  <line x1="440" y1="92" x2="440" y2="118" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="370" y="120" width="140" height="40" rx="6" fill="#fff7ed" stroke="#fb923c" stroke-width="1.5"/>
  <text x="440" y="145" text-anchor="middle" font-weight="600" fill="#c2410c">ROUTING</text>

  <line x1="440" y1="160" x2="440" y2="185" stroke="#475569" stroke-width="1"/>

  <line x1="440" y1="185" x2="200" y2="185" stroke="#dc2626" stroke-width="1.5"/>
  <line x1="200" y1="185" x2="200" y2="218" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="320" y="178" font-size="10" fill="#dc2626">DID not registered</text>

  <line x1="440" y1="185" x2="440" y2="238" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="468" y="216" font-size="10" fill="#16a34a">found</text>

  <rect x="130" y="220" width="140" height="40" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="200" y="244" text-anchor="middle" font-weight="600" fill="#991b1b">UNREGISTERED</text>

  <line x1="200" y1="260" x2="200" y2="292" stroke="#dc2626" stroke-width="1" marker-end="url(#arr-red)"/>

  <rect x="148" y="294" width="104" height="28" rx="12" fill="#fecaca" stroke="#ef4444"/>
  <text x="200" y="312" text-anchor="middle" font-size="10" fill="#991b1b">DISCONNECT</text>

  <rect x="350" y="240" width="180" height="55" rx="6" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="440" y="260" text-anchor="middle" font-weight="600" fill="#5b21b6">CONVERSATION</text>
  <text x="440" y="276" text-anchor="middle" font-size="10" fill="#7c3aed">Claude decides each turn</text>
  <text x="440" y="288" text-anchor="middle" font-size="10" fill="#7c3aed">(FallbackIntent → code-hook)</text>

  <line x1="440" y1="295" x2="440" y2="320" stroke="#475569" stroke-width="1"/>

  <line x1="440" y1="320" x2="440" y2="358" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="476" y="340" font-size="10" fill="#16a34a">lookup_patient</text>

  <path d="M 440 320 L 560 320 L 680 320 L 680 358" fill="none" stroke="#94a3b8" stroke-width="1" marker-end="url(#arr)"/>
  <text x="560" y="313" font-size="10" fill="#94a3b8">max turns / timeout</text>

  <path d="M 440 320 L 530 320 L 760 340 L 760 370 L 742 370" fill="none" stroke="#ec4899" stroke-width="1" marker-end="url(#arr)"/>
  <text x="770" y="345" font-size="10" fill="#ec4899">"talk to a human"</text>

  <rect x="370" y="360" width="140" height="40" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="440" y="377" text-anchor="middle" font-weight="600" fill="#92400e">VERIFY</text>
  <text x="440" y="392" text-anchor="middle" font-size="10" fill="#a16207">FHIR patient match</text>

  <rect x="620" y="360" width="120" height="40" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
  <text x="680" y="385" text-anchor="middle" font-weight="700" fill="#991b1b">ESCALATE</text>

  <line x1="440" y1="400" x2="440" y2="425" stroke="#475569" stroke-width="1"/>

  <line x1="440" y1="425" x2="200" y2="425" stroke="#16a34a" stroke-width="1.5"/>
  <line x1="200" y1="425" x2="200" y2="458" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="320" y="418" font-size="10" font-weight="600" fill="#16a34a">single match</text>

  <line x1="440" y1="425" x2="360" y2="425" stroke="#f59e0b" stroke-width="1"/>
  <line x1="360" y1="425" x2="360" y2="458" stroke="#f59e0b" stroke-width="1" marker-end="url(#arr)"/>
  <text x="405" y="440" font-size="10" fill="#f59e0b">multiple</text>

  <path d="M 510 380 L 618 380" fill="none" stroke="#dc2626" stroke-width="1" marker-end="url(#arr-red)"/>
  <text x="540" y="373" font-size="9" fill="#dc2626">no_match / error / rate_limited</text>


  <rect x="130" y="460" width="140" height="40" rx="6" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="200" y="485" text-anchor="middle" font-weight="700" fill="#166534">VERIFIED ✓</text>

  <rect x="290" y="460" width="140" height="40" rx="6" fill="#fef9c3" stroke="#eab308" stroke-width="1.5"/>
  <text x="360" y="485" text-anchor="middle" font-weight="600" fill="#854d0e">DISAMBIGUATE</text>

  <line x1="360" y1="500" x2="360" y2="520" stroke="#475569" stroke-width="1"/>
  <line x1="360" y1="520" x2="200" y2="520" stroke="#16a34a" stroke-width="1"/>
  <line x1="200" y1="500" x2="200" y2="520" stroke="#16a34a" stroke-width="1"/>
  <text x="275" y="513" font-size="10" fill="#16a34a">matched</text>

  <line x1="360" y1="520" x2="680" y2="520" stroke="#dc2626" stroke-width="1"/>
  <line x1="680" y1="400" x2="680" y2="520" stroke="#dc2626" stroke-width="1"/>
  <text x="520" y="513" font-size="10" fill="#dc2626">still ambiguous</text>

  <line x1="200" y1="500" x2="200" y2="558" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>

  <rect x="110" y="560" width="180" height="55" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="200" y="580" text-anchor="middle" font-weight="600" fill="#1e40af">SERVICE PHASE</text>
  <text x="200" y="596" text-anchor="middle" font-size="10" fill="#3b82f6">lab results · visit summary</text>
  <text x="200" y="608" text-anchor="middle" font-size="10" fill="#3b82f6">document status</text>

  <line x1="200" y1="615" x2="200" y2="640" stroke="#475569" stroke-width="1"/>

  <line x1="200" y1="640" x2="120" y2="640" stroke="#16a34a" stroke-width="1.5"/>
  <line x1="120" y1="640" x2="120" y2="668" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="155" y="633" font-size="10" fill="#16a34a">resolved</text>

  <line x1="200" y1="640" x2="290" y2="640" stroke="#3b82f6" stroke-width="1"/>
  <line x1="290" y1="640" x2="290" y2="668" stroke="#3b82f6" stroke-width="1" marker-end="url(#arr)"/>
  <text x="250" y="633" font-size="10" fill="#3b82f6">needs human</text>

  <rect x="60" y="670" width="120" height="40" rx="12" fill="#bbf7d0" stroke="#22c55e" stroke-width="2"/>
  <text x="120" y="695" text-anchor="middle" font-weight="700" fill="#166534">RESOLVED</text>
  <text x="120" y="730" text-anchor="middle" font-size="10" fill="#166534">Caller hangs up satisfied</text>

  <rect x="230" y="670" width="120" height="40" rx="12" fill="#bfdbfe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="290" y="688" text-anchor="middle" font-size="10" font-weight="600" fill="#1e40af">TRANSFER</text>
  <text x="290" y="702" text-anchor="middle" font-size="10" font-weight="600" fill="#1e40af">(verified)</text>
  <text x="290" y="730" text-anchor="middle" font-size="10" fill="#1e40af">Human gets context</text>

  <line x1="680" y1="520" x2="680" y2="668" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr-red)"/>

  <rect x="620" y="670" width="120" height="40" rx="12" fill="#fecaca" stroke="#ef4444" stroke-width="1.5"/>
  <text x="680" y="688" text-anchor="middle" font-size="10" font-weight="600" fill="#991b1b">TRANSFER</text>
  <text x="680" y="702" text-anchor="middle" font-size="10" font-weight="600" fill="#991b1b">(unverified)</text>
  <text x="680" y="730" text-anchor="middle" font-size="10" fill="#991b1b">Human must re-verify</text>

  <rect x="660" y="440" width="190" height="95" rx="6" fill="#fff" stroke="#e2e8f0"/>
  <text x="676" y="458" font-size="11" font-weight="600" fill="#0f172a">Legend</text>
  <line x1="676" y1="472" x2="706" y2="472" stroke="#16a34a" stroke-width="2"/>
  <text x="714" y="476" font-size="10" fill="#475569">Happy path</text>
  <line x1="676" y1="490" x2="706" y2="490" stroke="#dc2626" stroke-width="2"/>
  <text x="714" y="494" font-size="10" fill="#475569">Error / escalation</text>
  <line x1="676" y1="508" x2="706" y2="508" stroke="#f59e0b" stroke-width="2"/>
  <text x="714" y="512" font-size="10" fill="#475569">Disambiguation</text>
  <line x1="676" y1="526" x2="706" y2="526" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="714" y="530" font-size="10" fill="#475569">Timeout / abort</text>
</svg>

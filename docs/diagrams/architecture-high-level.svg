  <text x="395" y="478" text-anchor="middle" font-size="10" fill="#a16207">Claude + prompt + history</text>

  <rect x="490" y="442" width="160" height="50" rx="6" fill="#fff" stroke="#f59e0b" stroke-width="1"/>
  <text x="570" y="462" text-anchor="middle" font-size="11" font-weight="600" fill="#92400e">Tool Dispatch</text>
  <text x="570" y="478" text-anchor="middle" font-size="10" fill="#a16207">lookup · fhir_query</text>


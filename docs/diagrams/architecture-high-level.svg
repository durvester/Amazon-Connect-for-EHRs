  <line x1="470" y1="148" x2="488" y2="148" stroke="#475569" stroke-width="1" marker-end="url(#arrow)"/>

  <line x1="480" y1="214" x2="480" y2="248" stroke="#8b5cf6" stroke-width="1.5" marker-end="url(#arrow)"/>


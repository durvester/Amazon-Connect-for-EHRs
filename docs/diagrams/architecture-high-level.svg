  <text x="120" y="122" text-anchor="middle" font-size="11" fill="#3b82f6">Dials practice DID</text>

  <line x1="200" y1="110" x2="268" y2="110" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="234" y="103" text-anchor="middle" font-size="10" fill="#64748b">PSTN</text>

  <rect x="270" y="68" width="770" height="740" rx="8" fill="none" stroke="#f97316" stroke-width="1.5" stroke-dasharray="6,4"/>

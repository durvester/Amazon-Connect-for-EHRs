  <rect width="1060" height="820" fill="#f8fafc" rx="8"/>

  <text x="530" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Voice Agent — End-to-End Call Architecture</text>
  <text x="530" y="52" text-anchor="middle" font-size="11" fill="#64748b">Lex + Nova 2 Sonic + LLM Code-Hook (ADR-0019)</text>


  <rect x="40" y="80" width="160" height="60" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"/>

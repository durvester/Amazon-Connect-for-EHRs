  <text x="480" y="605" text-anchor="middle" font-size="11" fill="#be185d">Patient · DiagnosticReport · Encounter · DocumentReference</text>


  <rect x="720" y="100" width="170" height="48" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1" filter="url(#shadow)"/>
  <text x="805" y="120" text-anchor="middle" font-size="11" font-weight="600" fill="#92400e">DynamoDB</text>
  <text x="805" y="136" text-anchor="middle" font-size="10" fill="#a16207">phone_routing table</text>

  <line x1="470" y1="138" x2="470" y2="138" stroke="none"/>
  <path d="M 470 148 L 500 148 L 500 124 L 718 124" fill="none" stroke="#475569" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>


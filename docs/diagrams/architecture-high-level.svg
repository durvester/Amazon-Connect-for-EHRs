<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 900" font-family="Inter, -apple-system, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#475569"/>
    </marker>
    <filter id="shadow">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1100" height="900" fill="#f8fafc" rx="8"/>

  <!-- Title -->
  <text x="550" y="35" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">PF Voice Agent — End-to-End Call Architecture</text>
  <text x="550" y="55" text-anchor="middle" font-size="11" fill="#64748b">ADR-0018 · Session 0011 · Lex + Nova 2 Sonic + AgentCore Gateway</text>

  <!-- Caller -->
  <rect x="30" y="80" width="180" height="70" rx="12" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="120" y="108" text-anchor="middle" font-weight="600" fill="#1e40af">Patient / Caller</text>
  <text x="120" y="126" text-anchor="middle" font-size="11" fill="#3b82f6">Dials practice DID</text>
  <text x="120" y="140" text-anchor="middle" font-size="10" fill="#64748b">(480) 555-0147</text>

  <!-- Arrow: Caller → Connect -->
  <line x1="210" y1="115" x2="280" y2="115" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="245" y="108" text-anchor="middle" font-size="10" fill="#64748b">PSTN</text>

  <!-- AWS Cloud boundary -->
  <rect x="275" y="70" width="800" height="810" rx="8" fill="none" stroke="#f97316" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="680" y="88" text-anchor="middle" font-size="11" font-weight="600" fill="#f97316">AWS Account 086514900943 (us-east-1)</text>

  <!-- CONNECT BOX -->
  <rect x="290" y="95" width="400" height="160" rx="8" fill="#fff7ed" stroke="#fb923c" stroke-width="1" filter="url(#shadow)"/>
  <text x="490" y="115" text-anchor="middle" font-weight="700" font-size="14" fill="#c2410c">Amazon Connect</text>

  <!-- Router Lambda -->
  <rect x="310" y="130" width="150" height="50" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
  <text x="385" y="150" text-anchor="middle" font-size="11" font-weight="600" fill="#92400e">InvokeLambdaFunction</text>
  <text x="385" y="165" text-anchor="middle" font-size="10" fill="#a16207">Router Lambda (5s)</text>

  <!-- Update Attrs -->
  <rect x="310" y="190" width="150" height="35" rx="6" fill="#f0fdf4" stroke="#22c55e" stroke-width="1"/>
  <text x="385" y="212" text-anchor="middle" font-size="10" fill="#166534">UpdateContactAttributes</text>

  <!-- ConnectWithLex -->
  <rect x="480" y="130" width="190" height="100" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1"/>
  <text x="575" y="152" text-anchor="middle" font-size="11" font-weight="600" fill="#5b21b6">ConnectParticipant</text>
  <text x="575" y="167" text-anchor="middle" font-size="11" font-weight="600" fill="#5b21b6">WithLexBot</text>
  <text x="575" y="185" text-anchor="middle" font-size="10" fill="#7c3aed">session attrs:</text>
  <text x="575" y="198" text-anchor="middle" font-size="10" fill="#7c3aed">{practice_id}</text>
  <text x="575" y="218" text-anchor="middle" font-size="10" fill="#a78bfa">→ Disconnect after</text>

  <!-- Arrows in Connect -->
  <line x1="385" y1="180" x2="385" y2="190" stroke="#475569" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="460" y1="155" x2="480" y2="155" stroke="#475569" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- phone_routing table -->
  <rect x="720" y="110" width="150" height="50" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1" filter="url(#shadow)"/>
  <text x="795" y="132" text-anchor="middle" font-size="11" font-weight="600" fill="#92400e">DynamoDB</text>
  <text x="795" y="148" text-anchor="middle" font-size="10" fill="#a16207">phone_routing table</text>

  <!-- Arrow: Router → DDB -->
  <line x1="460" y1="145" x2="720" y2="135" stroke="#475569" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

  <!-- LEX BOX -->
  <rect x="290" y="280" width="400" height="200" rx="8" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1" filter="url(#shadow)"/>
  <text x="490" y="300" text-anchor="middle" font-weight="700" font-size="14" fill="#5b21b6">Amazon Lex V2</text>
  <text x="490" y="316" text-anchor="middle" font-size="11" fill="#7c3aed">Nova 2 Sonic (speech-to-speech at locale)</text>

  <!-- Intent box -->
  <rect x="310" y="330" width="170" height="65" rx="6" fill="#fff" stroke="#a78bfa" stroke-width="1"/>
  <text x="395" y="350" text-anchor="middle" font-size="11" font-weight="600" fill="#5b21b6">VerifyAndResolve</text>
  <text x="395" y="365" text-anchor="middle" font-size="10" fill="#7c3aed">CallerFirstName</text>
  <text x="395" y="378" text-anchor="middle" font-size="10" fill="#7c3aed">CallerLastName</text>
  <text x="395" y="391" text-anchor="middle" font-size="10" fill="#7c3aed">DateOfBirth</text>

  <!-- Fallback intent -->
  <rect x="310" y="405" width="170" height="35" rx="6" fill="#fff" stroke="#a78bfa" stroke-width="1"/>
  <text x="395" y="427" text-anchor="middle" font-size="10" fill="#7c3aed">FallbackIntent → escalate</text>

  <!-- Code-hook Lambda -->
  <rect x="500" y="330" width="170" height="120" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1" filter="url(#shadow)"/>
  <text x="585" y="350" text-anchor="middle" font-size="11" font-weight="700" fill="#92400e">Code-Hook Lambda</text>
  <text x="585" y="368" text-anchor="middle" font-size="10" fill="#a16207">DialogCodeHook</text>
  <text x="585" y="381" text-anchor="middle" font-size="10" fill="#a16207">→ Delegate</text>
  <text x="585" y="400" text-anchor="middle" font-size="10" fill="#a16207">FulfillmentCodeHook</text>
  <text x="585" y="413" text-anchor="middle" font-size="10" fill="#a16207">→ lookup_patient</text>
  <text x="585" y="426" text-anchor="middle" font-size="10" fill="#a16207">→ verify + respond</text>
  <text x="585" y="444" text-anchor="middle" font-size="10" fill="#a16207">→ Close / ElicitSlot</text>

  <!-- Arrow: Connect → Lex -->
  <line x1="575" y1="230" x2="490" y2="280" stroke="#8b5cf6" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Arrow: Intent → Code-hook -->
  <line x1="480" y1="360" x2="500" y2="360" stroke="#475569" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- GATEWAY BOX -->
  <rect x="290" y="510" width="400" height="120" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1" filter="url(#shadow)"/>
  <text x="490" y="530" text-anchor="middle" font-weight="700" font-size="14" fill="#065f46">Bedrock AgentCore Gateway</text>
  <text x="490" y="546" text-anchor="middle" font-size="11" fill="#047857">MCP Tool Catalog (ADR-0012)</text>

  <!-- Tool boxes -->
  <rect x="310" y="560" width="110" height="45" rx="4" fill="#d1fae5" stroke="#34d399" stroke-width="1"/>
  <text x="365" y="578" text-anchor="middle" font-size="10" font-weight="600" fill="#065f46">lookup_patient</text>
  <text x="365" y="593" text-anchor="middle" font-size="9" fill="#047857">✅ deployed</text>

  <rect x="430" y="560" width="110" height="45" rx="4" fill="#d1fae5" stroke="#34d399" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="485" y="578" text-anchor="middle" font-size="10" font-weight="600" fill="#065f46">lab_result_status</text>
  <text x="485" y="593" text-anchor="middle" font-size="9" fill="#94a3b8">future</text>

  <rect x="550" y="560" width="120" height="45" rx="4" fill="#d1fae5" stroke="#34d399" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="610" y="578" text-anchor="middle" font-size="10" font-weight="600" fill="#065f46">visit_summary /</text>
  <text x="610" y="593" text-anchor="middle" font-size="9" fill="#94a3b8">document_status</text>

  <!-- Arrow: Code-hook → Gateway -->
  <line x1="585" y1="450" x2="490" y2="510" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="560" y="478" font-size="10" fill="#64748b">MCP tool call</text>

  <!-- FHIR box -->
  <rect x="290" y="660" width="400" height="60" rx="8" fill="#fce7f3" stroke="#ec4899" stroke-width="1" filter="url(#shadow)"/>
  <text x="490" y="685" text-anchor="middle" font-weight="700" font-size="14" fill="#9d174d">Practice Fusion FHIR R4</text>
  <text x="490" y="702" text-anchor="middle" font-size="11" fill="#be185d">GET /Patient?telecom=&amp;birthdate= (6 format probes)</text>

  <!-- Arrow: Gateway → FHIR -->
  <line x1="490" y1="630" x2="490" y2="660" stroke="#ec4899" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- RIGHT SIDE: Supporting services -->

  <!-- Rate limit -->
  <rect x="720" y="185" width="150" height="50" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1" filter="url(#shadow)"/>
  <text x="795" y="207" text-anchor="middle" font-size="11" font-weight="600" fill="#92400e">DynamoDB</text>
  <text x="795" y="223" text-anchor="middle" font-size="10" fill="#a16207">rate-limit table</text>

  <!-- Practices + tokens -->
  <rect x="720" y="260" width="150" height="70" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1" filter="url(#shadow)"/>
  <text x="795" y="282" text-anchor="middle" font-size="11" font-weight="600" fill="#92400e">DynamoDB</text>
  <text x="795" y="298" text-anchor="middle" font-size="10" fill="#a16207">practices table</text>
  <text x="795" y="314" text-anchor="middle" font-size="10" fill="#a16207">oauth-tokens table</text>

  <!-- Secrets Manager -->
  <rect x="720" y="355" width="150" height="45" rx="6" fill="#fde68a" stroke="#eab308" stroke-width="1" filter="url(#shadow)"/>
  <text x="795" y="375" text-anchor="middle" font-size="11" font-weight="600" fill="#854d0e">Secrets Manager</text>
  <text x="795" y="390" text-anchor="middle" font-size="10" fill="#a16207">pf-client-secret</text>

  <!-- Audit log -->
  <rect x="720" y="425" width="150" height="65" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1" filter="url(#shadow)"/>
  <text x="795" y="447" text-anchor="middle" font-size="11" font-weight="700" fill="#991b1b">S3 Audit Bucket</text>
  <text x="795" y="463" text-anchor="middle" font-size="10" fill="#dc2626">Object Lock + KMS</text>
  <text x="795" y="478" text-anchor="middle" font-size="10" fill="#dc2626">7-year retention</text>

  <!-- KMS -->
  <rect x="720" y="515" width="150" height="45" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1" filter="url(#shadow)"/>
  <text x="795" y="535" text-anchor="middle" font-size="11" font-weight="600" fill="#475569">KMS CMKs</text>
  <text x="795" y="550" text-anchor="middle" font-size="10" fill="#64748b">phi-key · oauth-key</text>

  <!-- Dashed arrows from lookup_patient to supporting services -->
  <line x1="420" y1="583" x2="720" y2="210" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,3" marker-end="url(#arrow)"/>
  <line x1="420" y1="583" x2="720" y2="290" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,3" marker-end="url(#arrow)"/>
  <line x1="420" y1="583" x2="720" y2="375" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,3" marker-end="url(#arrow)"/>
  <line x1="420" y1="583" x2="720" y2="455" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,3" marker-end="url(#arrow)"/>

  <!-- Onboarding API -->
  <rect x="720" y="600" width="340" height="120" rx="8" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="1" filter="url(#shadow)"/>
  <text x="890" y="620" text-anchor="middle" font-weight="700" font-size="14" fill="#0369a1">Onboarding API (FastAPI)</text>
  <text x="890" y="638" text-anchor="middle" font-size="10" fill="#0284c7">Lambda + Function URL (ADR-0015)</text>
  <text x="890" y="660" text-anchor="middle" font-size="10" fill="#0284c7">/oauth/start → PF authorization</text>
  <text x="890" y="675" text-anchor="middle" font-size="10" fill="#0284c7">/oauth/callback → exchange + store tokens</text>
  <text x="890" y="690" text-anchor="middle" font-size="10" fill="#0284c7">→ claim DID + write phone_routing</text>
  <text x="890" y="708" text-anchor="middle" font-size="10" fill="#0ea5e9">↔ DDB: practices, tokens, state, routing</text>

  <!-- Legend -->
  <rect x="30" y="770" width="300" height="110" rx="6" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="45" y="790" font-size="11" font-weight="600" fill="#0f172a">Legend</text>
  <rect x="45" y="800" width="20" height="12" rx="2" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
  <text x="75" y="811" font-size="10" fill="#475569">Lambda / DynamoDB</text>
  <rect x="45" y="820" width="20" height="12" rx="2" fill="#d1fae5" stroke="#34d399" stroke-width="1"/>
  <text x="75" y="831" font-size="10" fill="#475569">MCP Tool (via Gateway)</text>
  <rect x="45" y="840" width="20" height="12" rx="2" fill="#fee2e2" stroke="#ef4444" stroke-width="1"/>
  <text x="75" y="851" font-size="10" fill="#475569">HIPAA Audit (immutable)</text>
  <rect x="175" y="800" width="20" height="12" rx="2" fill="#d1fae5" stroke="#34d399" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="205" y="811" font-size="10" fill="#475569">Future (not yet built)</text>
  <line x1="175" y1="826" x2="195" y2="826" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,3" marker-end="url(#arrow)"/>
  <text x="205" y="831" font-size="10" fill="#475569">Data flow</text>
</svg>

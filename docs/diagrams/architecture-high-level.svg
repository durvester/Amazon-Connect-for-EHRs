  <text x="390" y="145" text-anchor="middle" font-size="11" font-weight="600" fill="#92400e">Router Lambda</text>
  <text x="390" y="160" text-anchor="middle" font-size="10" fill="#a16207">DID → practice lookup</text>

  <rect x="490" y="128" width="160" height="40" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1"/>

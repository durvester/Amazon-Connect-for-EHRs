  <text x="805" y="206" text-anchor="middle" font-size="10" fill="#a16207">practices table</text>
  <text x="805" y="222" text-anchor="middle" font-size="10" fill="#a16207">oauth-tokens table</text>

  <rect x="720" y="258" width="170" height="48" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1" filter="url(#shadow)"/>
  <text x="805" y="278" text-anchor="middle" font-size="11" font-weight="600" fill="#92400e">DynamoDB</text>
  <text x="805" y="294" text-anchor="middle" font-size="10" fill="#a16207">rate-limit table</text>

  <rect x="720" y="328" width="170" height="48" rx="6" fill="#fde68a" stroke="#eab308" stroke-width="1" filter="url(#shadow)"/>
  <text x="805" y="348" text-anchor="middle" font-size="11" font-weight="600" fill="#854d0e">Secrets Manager</text>
  <text x="805" y="364" text-anchor="middle" font-size="10" fill="#a16207">client-secret</text>

  <rect x="720" y="398" width="170" height="60" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="805" y="418" text-anchor="middle" font-size="11" font-weight="700" fill="#991b1b">S3 Audit Bucket</text>
  <text x="805" y="434" text-anchor="middle" font-size="10" fill="#dc2626">Object Lock + KMS</text>
  <text x="805" y="450" text-anchor="middle" font-size="10" fill="#dc2626">7-year retention</text>

  <rect x="720" y="480" width="170" height="48" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1" filter="url(#shadow)"/>
  <text x="805" y="500" text-anchor="middle" font-size="11" font-weight="600" fill="#475569">KMS CMKs</text>
  <text x="805" y="516" text-anchor="middle" font-size="10" fill="#64748b">phi-key · oauth-key</text>

  <line x1="670" y1="455" x2="718" y2="202" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,3" marker-end="url(#arrow)"/>
  <line x1="670" y1="460" x2="718" y2="282" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,3" marker-end="url(#arrow)"/>
  <line x1="670" y1="465" x2="718" y2="352" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,3" marker-end="url(#arrow)"/>
  <line x1="670" y1="470" x2="718" y2="428" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,3" marker-end="url(#arrow)"/>

  <rect x="720" y="560" width="300" height="110" rx="8" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="1" filter="url(#shadow)"/>
  <text x="870" y="582" text-anchor="middle" font-weight="700" font-size="14" fill="#0369a1">Onboarding API (FastAPI)</text>
  <text x="870" y="600" text-anchor="middle" font-size="10" fill="#0284c7">Lambda + Function URL</text>
  <text x="870" y="620" text-anchor="middle" font-size="10" fill="#0284c7">/oauth/start → SMART-on-FHIR authorization</text>
  <text x="870" y="636" text-anchor="middle" font-size="10" fill="#0284c7">/oauth/callback → exchange + store tokens</text>
  <text x="870" y="652" text-anchor="middle" font-size="10" fill="#0284c7">→ claim DID + write routing</text>


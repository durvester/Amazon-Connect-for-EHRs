[project]
name = "pf-audit"
version = "0.0.1"
description = "HIPAA accounting-of-disclosures + per-(practice,ANI) rate limit"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.34",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "moto[s3,dynamodb,kms]>=5",
    "ruff>=0.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integration: requires real AWS / PF; skipped unless env vars set",
]

[tool.ruff]
line-length = 100
target-version = "py312"
